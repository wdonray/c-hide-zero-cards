name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browser
        # Headless shell only: smaller/faster download, sufficient for CI.
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build
