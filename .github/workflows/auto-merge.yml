name: Auto-merge on green CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: |
          if [ "$(gh pr view "${{ github.event.pull_request.html_url }}" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "false" ]; then
            gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
