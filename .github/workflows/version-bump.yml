name: Version Bump

on:
  push:
    branches:
      - main

# Serialize runs. Without this, overlapping runs compute the same next version
# from a stale checkout and race on tag creation, failing with
# `fatal: tag 'vX.Y.Z' already exists`.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.head_commit.message, '[RELEASE]') && !contains(github.event.head_commit.message, 'skip-release') && !startsWith(github.event.head_commit.message, 'chore: bump version to') }}"
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check if a release is needed
        id: check
        run: |
          # Docs, legal, and CI-process files never change the deployed site.
          # If every file in this push matches, skip the version bump
          # automatically.
          if git diff --name-only HEAD~1 HEAD | grep -qvE '(\.md$|^LICENSE$|^\.github/)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Release-worthy changes detected."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Docs/meta-only push. Skipping release automatically."
          fi

      - name: Sync to latest main
        if: steps.check.outputs.needed == 'true'
        run: |
          # The checkout pins the trigger commit, which may predate a bump
          # pushed by an earlier serialized run. Move to the tip so the
          # version is computed from the latest package.json.
          git fetch origin main
          git checkout -q -B main origin/main

      - name: Configure git
        if: steps.check.outputs.needed == 'true'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Determine version bump type
        id: version-type
        if: steps.check.outputs.needed == 'true'
        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          # Check for breaking changes
          if [[ "$COMMIT_MESSAGE" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MESSAGE" == *"!:"* ]]; then
            echo "newversion=major" >> $GITHUB_OUTPUT
            echo "Bump type: major (breaking change detected)"
          elif [[ "$COMMIT_MESSAGE" =~ ^feat: ]]; then
            echo "newversion=minor" >> $GITHUB_OUTPUT
            echo "Bump type: minor (feature commit detected)"
          elif [[ "$COMMIT_MESSAGE" =~ ^fix: ]]; then
            echo "newversion=patch" >> $GITHUB_OUTPUT
            echo "Bump type: patch (fix commit detected)"
          else
            echo "newversion=patch" >> $GITHUB_OUTPUT
            echo "Bump type: patch (default for non-conventional commits)"
          fi

      - name: Bump version
        if: steps.check.outputs.needed == 'true'
        run: |
          # Guard: if the tag already exists, determine why before proceeding.
          NEXT="$(node -p "const v=require('./package.json').version.split('.').map(Number);const t='${{ steps.version-type.outputs.newversion }}';if(t==='major'){v[0]++;v[1]=0;v[2]=0}else if(t==='minor'){v[1]++;v[2]=0}else{v[2]++}v.join('.')")"
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            if git merge-base --is-ancestor "v$NEXT" main 2>/dev/null; then
              echo "Tag v$NEXT is already on main; skipping bump."
              exit 0
            fi
            # Orphaned tag: a past race pushed the tag but its commit never
            # landed on main (git pushes refs independently). It was never
            # released, so remove it and proceed with a clean bump.
            echo "Tag v$NEXT is orphaned (not on main); deleting it and proceeding."
            git push --delete origin "v$NEXT"
            git tag -d "v$NEXT"
          fi
          npm version ${{ steps.version-type.outputs.newversion }} -m "chore: bump version to %s [deploy]"

      - name: Push changes and tags
        if: steps.check.outputs.needed == 'true'
        run: |
          # --atomic: the commit and tag land together or not at all, so a
          # rejected branch push can never leave an orphaned tag behind.
          git push --atomic origin main --follow-tags
