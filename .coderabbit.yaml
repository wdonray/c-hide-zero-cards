# CodeRabbit configuration for Hide Zero Cards
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
# Donray tunes review behavior here. His agent (Muse) reviews every
# CodeRabbit comment and either addresses it or resolves it.
#
# REVIEW FOCUS: Only things that affect what the user sees or experiences.
# Bugs, regressions, performance issues, and security flaws. Nothing else.
#
# This is a live classroom tool. Stability is the top priority:
# flag anything that could change behavior for teachers or students.

language: 'en-US'

reviews:
  # "chill" = fewer comments, only significant issues.
  profile: 'chill'
  # Don't use GitHub's "request changes" flow; branch protection's
  # "require conversation resolution" is what gates merges.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  # Donray's agent (Muse) handles all fixes. CodeRabbit only finds issues,
  # never writes code. Disable every finishing touch that generates commits.
  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  # Only review what matters: bugs, regressions, performance, security.
  # Do NOT comment on code style, naming, refactoring opportunities,
  # or subjective "best practices" that don't affect behavior.
  review_instructions: |
    Focus ONLY on issues that affect the user-visible outcome:
    - Bugs: logic errors, null/undefined crashes, broken behavior
    - Regressions: changes that break previously working functionality,
      especially the card fan layout (right-aligned, no slivers)
    - Performance: real bottlenecks, not micro-optimizations
    - Security: vulnerabilities, exposed secrets, injection risks
    Do NOT comment on: code style, formatting, naming conventions,
    refactoring suggestions, or subjective preferences. If it's not
    a bug, regression, performance problem, or security issue, stay silent.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'main'
    # Skip dependabot noise; those PRs are auto-merged on green CI.
    ignore_title_keywords:
      - 'dependabot'
  path_filters:
    - '!**/*.lock'
    - '!package-lock.json'
    - '!**/*.snap'

chat:
  auto_reply: true
